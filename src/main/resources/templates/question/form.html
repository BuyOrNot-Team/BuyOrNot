<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>질문 등록</title>
</head>
<body>
<main layout:fragment="content" class="container my-4" style="max-width: 720px;">

    <h2 class="mb-4">질문 등록</h2>

    <form th:action="@{/questions/new}" method="post"
          th:object="${questionFormDTO}"
          enctype="multipart/form-data">

        <!-- 제목 -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                제목 <span class="text-danger">*</span>
            </label>
            <input type="text" class="form-control"
                   th:field="*{title}"
                   th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                   placeholder="질문 제목을 입력하세요">
            <div class="invalid-feedback" th:errors="*{title}"></div>
        </div>

        <!-- 내용 -->
        <div class="mb-3">
            <label class="form-label fw-semibold">
                내용 <span class="text-danger">*</span>
            </label>
            <textarea class="form-control" rows="6"
                      th:field="*{content}"
                      th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                      placeholder="살까 말까 고민되는 이유를 자세히 적어주세요"></textarea>
            <div class="invalid-feedback" th:errors="*{content}"></div>
        </div>

        <!-- 상품명 / 가격 -->
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label fw-semibold">
                    상품명 <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control"
                       th:field="*{productName}"
                       th:classappend="${#fields.hasErrors('productName')} ? 'is-invalid'"
                       placeholder="예) 나이키 에어포스1">
                <div class="invalid-feedback" th:errors="*{productName}"></div>
            </div>
            <div class="col-md-4">
                <label class="form-label fw-semibold">가격 (원)</label>
                <input type="number" class="form-control"
                       th:field="*{price}"
                       th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                       placeholder="예) 129000" min="0">
                <div class="invalid-feedback" th:errors="*{price}"></div>
            </div>
        </div>

        <!-- 장·단점 -->
        <div class="row g-3 mb-3">
            <div class="col-md-6">
                <label class="form-label text-success fw-semibold">👍 장점</label>
                <textarea class="form-control" rows="3"
                          th:field="*{pros}"
                          placeholder="이 상품의 장점은?"></textarea>
            </div>
            <div class="col-md-6">
                <label class="form-label text-danger fw-semibold">👎 단점</label>
                <textarea class="form-control" rows="3"
                          th:field="*{cons}"
                          placeholder="이 상품의 단점은?"></textarea>
            </div>
        </div>

        <!-- 상품 이미지 -->
        <div class="mb-4">
            <label class="form-label fw-semibold">상품 이미지</label>
            <input type="file" class="form-control" name="imageFile"
                   accept="image/*">
            <div class="form-text text-muted">jpg, png, gif 등 이미지 파일을 선택하세요. (선택사항)</div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">등록</button>
            <a th:href="@{/questions}" class="btn btn-outline-secondary">취소</a>
        </div>

    </form>

</main>
</body>
</html>
