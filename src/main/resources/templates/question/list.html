<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <meta charset="UTF-8">
    <title>모든 질문</title>
</head>
<body>
<div layout:fragment="content" class="d-flex flex-column full-dashboard" style="background-color: #ffffff;">

    <div class="container-fluid px-5 py-4 d-flex flex-column flex-grow-1">

        <div class="row g-0 rounded-4 overflow-hidden flex-grow-1 sidebar-bg" style="min-height: 0;">

            <div class="p-4 col-12 h-lg-100" style="overflow-y: auto;">

                <div class="d-flex justify-content-between align-items-center mb-4"
                     th:unless="${#lists.isEmpty(questions.getQuestions())}">
                    <span class="fs-5 fw-bold" th:text="|질문 ${questions.getTotalItemCount}개|">질문 1개</span>
                    <div class="d-flex gap-2">
                        <a th:href="@{/questions(sort='createdAt,desc', page=0, q=${searchText})}"
                           class="btn btn-sm rounded-pill px-4 py-2"
                           th:classappend="${sortType=='createdAt'}? 'btn-green' : 'btn-white'">최신순</a>
                        <a th:href="@{/questions(sort='viewCount,desc', page=0, q=${searchText})}"
                           class="btn btn-sm rounded-pill px-4 py-2"
                           th:classappend="${sortType=='viewCount'}? 'btn-green' : 'btn-white'">인기순</a>
                    </div>
                </div>

                <div th:if="${#lists.isEmpty(questions.getQuestions())}" class="text-white py-5 text-center fs-5">
                    등록된 질문이 없습니다. 첫 질문을 작성해 보세요!
                </div>

                <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4"
                     th:unless="${#lists.isEmpty(questions.getQuestions())}">
                    <div class="col" th:each="question: ${questions.getQuestions()}">
                        <a th:href="@{/questions/{questionId}(questionId=${question.getQuestionId()})}"
                           class="text-decoration-none d-block h-100">
                            <div th:replace="~{main/question-card :: qCard(question=${question})}"></div>
                        </a>
                    </div>
                </div>
            </div>

        </div>

        <nav aria-label="Page navigation" class="d-flex justify-content-center align-items-center mt-4">
            <ul class="pagination gap-2 pagination-clean m-0"
                th:with="
        start=${(pageable.getPageNumber()) < 5 ? 1 : pageable.getPageNumber()-4},
        end=${(start + 8 < questions.getTotalPageCount()) ? start + 8 : questions.getTotalPageCount()}
      ">
                <th:block th:if="${end > 0}">
                    <li class="page-item"
                        th:each="page : ${#numbers.sequence(start, end)}"
                        th:classappend="${page - 1 == pageable.getPageNumber()} ? 'active'">
                        <a class="page-link rounded-circle"
                           th:href="@{/questions(sort=|${sortType},desc|, page=${page-1}, q=${searchText})}"
                           th:text="${page}">1</a>
                    </li>
                </th:block>
            </ul>
        </nav>
    </div>

</div>

<th:block layout:fragment="script">
</th:block>
</body>
</html>
