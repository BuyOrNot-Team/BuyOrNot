<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base(hideNavbar=false)}">
<head>
    <meta charset="UTF-8">
    <title>홈</title>
</head>
<body>
<div layout:fragment="content">
    <div th:if="${#lists.isEmpty(questions.getQuestions())}">
        등록된 질문이 없습니다. 첫 질문을 작성해 보세요!
    </div>

    <div class="d-flex">
        <div>
            <div>
                <div class="filter-label mb-2">카테고리</div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="chip active" data-group="cat">전체</button>
                    <button class="chip" data-group="cat">전자기기</button>
                    <button class="chip" data-group="cat">패션</button>
                    <button class="chip" data-group="cat">음식</button>
                    <button class="chip" data-group="cat">뷰티</button>
                    <button class="chip" data-group="cat">생활</button>
                </div>
            </div>

            <div>
                <div class="filter-label mb-2">가격대</div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="chip" data-group="price">~1만</button>
                    <button class="chip active" data-group="price">1~10</button>
                    <button class="chip" data-group="price">10~50만</button>
                    <button class="chip" data-group="price">50만+</button>
                </div>
            </div>

            <div>
                <div class="filter-label mb-2">커뮤니티 의견</div>
                <div class="d-flex flex-wrap gap-2">
                    <button class="chip buy-chip active">살래 우세</button>
                    <button class="chip pass-chip active">말래 우세</button>
                    <button class="chip">팽팽</button>
                </div>
            </div>
        </div>

        <div>
            <div class="d-flex justify-content-between align-items-center mb-4"
                 th:unless="${#lists.isEmpty(questions.getQuestions())}">
                <span class="q-count">질문 238개</span>
                <div class="d-flex gap-2">
                    <button class="sort-btn active">최신순</button>
                    <button class="sort-btn">인기순</button>
                    <button class="sort-btn">답변 많은 순</button>
                </div>
            </div>

            <div class="container mt-5">
                <div class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col" th:each="question: ${questions.getQuestions()}">
                        <div class="card h-100 p-3 shadow-sm">
                            <div class="card-title-text mb-2" th:text="${question.getTitle()}">제목</div>
                            <div class="card-price mb-3" th:text="${question.getPrice()}">가격</div>

                            <div class="mb-1">
                                <div class="mb-1">
                                    <div class="bar-buy" style="width:${question.getBuyRatio()}%"></div>
                                </div>
                                <div class="d-flex justify-content-between">
                                    <span class="vote-buy" th:text="${question.getBuyRatio()}">살래 50%</span>
                                    <span class="vote-not-buy" th:text="${question.getNotBuyRatio()}">말래 50%</span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between">
                                <span class="meta-answers" th:text="${question.getAnswerCount()}">답변 50개</span>
                                <span class="meta-time" th:text="${question.getTimeAgo()}">1시간 전</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="script">
    <!-- common.js 이외의 js 파일 import가 필요한 경우 아래와 같이 사용 -->
    <!--<script th:src="@{/js/파일명.js}"></script>-->
</th:block>
</body>
</html>
