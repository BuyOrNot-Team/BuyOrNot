<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
    <head>
        <meta charset="UTF-8">
        <title layout:title-pattern="$CONTENT_TITLE | 살래말래">살래말래</title>
        <link rel="icon" type="image/png" th:href="@{/images/favicon.png}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body class="min-vh-100 d-flex flex-column">
        <!-- navbar 영역 : hideNavbar가 false일 때만 렌더링 -->
        <th:block th:if="${hideNavbar != true}">
            <header th:replace="~{layout/navbar :: navbarFragment}"></header>
        </th:block>

        <!-- 플래시 메시지 -->
        <div th:if="${flashSuccess}" class="container-fluid px-4 pt-3">
            <div class="alert alert-success alert-dismissible fade show mb-0" role="alert">
                <span th:text="${flashSuccess}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </div>

        <!-- content 영역 : 실제 기능 html이 들어갈 자리 -->
        <main layout:fragment="content" class="px-4 py-4 flex-grow-1"></main>

        <!-- footer 영역 : 모든 페이지에 포함될 기본 레이아웃 -->
        <div th:replace="~{layout/footer :: footerFragment}"></div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/common.js}"></script>

        <!-- script 영역 : common.js 이외의 js 파일을 import할 때 사용 -->
        <th:block layout:fragment="script"></th:block>
    </body>
</html>
