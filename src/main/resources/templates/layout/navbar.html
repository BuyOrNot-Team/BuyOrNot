<nav th:fragment="navbarFragment" class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3">
    <div class="container-fluid px-4">
        <!-- 로고 -->
        <a class="navbar-brand fw-bold fs-4" href="/">
            살래<span style="color: #22C55E;">말래</span>
        </a>

        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav ms-lg-5 mt-lg-0 mt-4 mb-2 mb-lg-0 gap-lg-4 gap-3 text-lg-start text-center">
                <li class="nav-item">
                    <a class="nav-link" href="/"
                       th:classappend="${currentURI == '/'} ? 'fw-bold active' : 'text-secondary'">홈</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/questions"
                       th:classappend="${currentURI == '/questions'} ? 'fw-bold active' : 'text-secondary'">전체보기</a>
                </li>
            </ul>

            <!-- 우측 영역 -->
            <div class="d-flex flex-lg-row flex-column align-items-center ms-auto gap-3 mt-lg-0 mt-4">
                <!-- 검색창 -->
                <form th:action="@{/questions}" method="get" class="m-0 w-100 w-lg-auto" role="search">
                    <div class="position-relative w-100 w-lg-auto">
                        <input class="form-control border-0 rounded-pill px-4"
                               type="search"
                               name="q"
                               th:value="${searchText}"
                               placeholder="🔍 검색"
                               style="width: 100%; min-width: 250px; background-color: #f7f7f7;">
                    </div>
                </form>

                <!-- 로그인 상태: 프로필 드롭다운 + 질문하기 -->
                <div th:if="${navMember != null}" class="d-flex align-items-center gap-3 w-100">
                    <div class="dropdown w-lg-auto">
                        <div class="rounded-circle bg-light d-flex align-items-center justify-content-center fw-bold dropdown-toggle"
                             style="width: 40px; height: 40px; font-size: 0.9rem; color: #555; flex-shrink: 0; cursor: pointer;"
                             data-bs-toggle="dropdown" aria-expanded="false"
                             th:text="${#strings.substring(navMember.nickname, 0, 1)}">
                        </div>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" style="min-width: 180px;">
                            <!-- 닉네임 -->
                            <li class="px-3 pt-2 pb-1 fw-bold text-dark" th:text="${navMember.nickname}"></li>
                            <!-- 현재 소비패턴 -->
                            <li class="px-3 pb-2" th:if="${navMember.consumerType != null}">
                                <span class="ct-badge"
                                      th:style="'background-color: ' + ${navMember.consumerType.color}"
                                      th:text="${navMember.consumerType.note}"></span>
                            </li>
                            <li><hr class="dropdown-divider my-1"></li>
                            <li><a class="dropdown-item py-2" th:href="@{/mypage}">마이페이지</a></li>
                            <li><a class="dropdown-item py-2" th:href="@{/mypage/activity}">나의 활동</a></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <button type="submit" class="dropdown-item py-2 text-danger w-100 text-start border-0">로그아웃</button>
                                </form>
                            </li>
                        </ul>
                    </div>


                    <!-- 질문하기 버튼 -->
                    <button th:onclick="|location.href='@{/questions/form}'|" class="btn btn-outline-secondary rounded-pill px-4 py-2 w-100" type="button" style="font-size: 0.9rem;">
                        📝 질문하기
                    </button>
                </div>

                <!-- 비로그인 상태: 로그인 + 회원가입 -->
                <div th:if="${navMember == null}" class="d-flex align-items-center gap-2 mt-lg-0 mt-3 w-100 w-lg-auto justify-content-center">
                    <a th:href="@{/login}" class="btn btn-outline-secondary rounded-pill px-4 py-2" style="font-size: 0.9rem;">로그인</a>
                    <a th:href="@{/signup}" class="btn btn-green rounded-pill px-4 py-2" style="font-size: 0.9rem;">회원가입</a>
                </div>
            </div>
        </div>
    </div>
</nav>
