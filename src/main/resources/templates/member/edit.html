<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
    <head>
        <title>내 정보 수정</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <h2 class="mb-4">내 정보 수정</h2>

                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="@{/mypage/edit}" th:object="${editForm}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- 아이디 (수정 불가) -->
                            <div class="mb-3">
                                <label class="form-label fw-bold text-muted">아이디</label>
                                <input type="text" class="form-control bg-light" th:value="${member.username}" disabled>
                            </div>

                            <!-- 닉네임 -->
                            <div class="mb-3">
                                <label for="nickname" class="form-label">닉네임</label>
                                <input type="text" class="form-control" id="nickname" th:field="*{nickname}"
                                       th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
                            </div>

                            <!-- 이메일 -->
                            <div class="mb-3">
                                <label for="email" class="form-label">이메일</label>
                                <input type="email" class="form-control" id="email" th:field="*{email}"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <hr class="my-4">

                            <!-- 비밀번호 변경 (선택) -->
                            <div class="mb-1">
                                <label class="form-label fw-bold">비밀번호 변경
                                    <small class="fw-normal text-muted">(변경하지 않으려면 비워두세요)</small>
                                </label>
                            </div>
                            <!-- OAuth 전용 사용자 안내 -->
                            <div th:if="${member.password == null}" class="alert alert-info small mb-3">
                                비밀번호를 설정하면 이메일 로그인도 사용할 수 있습니다.
                            </div>

                            <div class="mb-3">
                                <label for="newPassword" class="form-label">새 비밀번호</label>
                                <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                                       th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"
                                       placeholder="8자 이상">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></div>
                            </div>

                            <div class="mb-4">
                                <label for="newPasswordConfirm" class="form-label">새 비밀번호 확인</label>
                                <input type="password" class="form-control" id="newPasswordConfirm" th:field="*{newPasswordConfirm}"
                                       th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}"></div>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">저장</button>
                                <a th:href="@{/mypage}" class="btn btn-outline-secondary">취소</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
