<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
    <head>
        <title>마이페이지</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-7">
                        <h2 class="mb-4">마이페이지</h2>

                        <div class="card">
                            <div class="card-body">
                                <div class="row py-2">
                                    <div class="col-3 fw-bold text-muted">아이디</div>
                                    <div class="col-9" th:text="${member.username}"></div>
                                </div>
                                <hr class="my-2">
                                <div class="row py-2">
                                    <div class="col-3 fw-bold text-muted">닉네임</div>
                                    <div class="col-9" th:text="${member.nickname}"></div>
                                </div>
                                <hr class="my-2">
                                <div class="row py-2">
                                    <div class="col-3 fw-bold text-muted">이메일</div>
                                    <div class="col-9" th:text="${member.email}"></div>
                                </div>
                                <hr class="my-2">
                                <div class="row py-2">
                                    <div class="col-3 fw-bold text-muted">가입일</div>
                                    <div class="col-9" th:text="${#temporals.format(member.createdAt, 'yyyy-MM-dd HH:mm')}"></div>
                                </div>
                                <hr class="my-2">
                                <!-- 소비패턴 조회 -->
                                <div class="row py-2 align-items-center">
                                    <div class="col-3 fw-bold text-muted">소비패턴</div>
                                    <div class="col-9 d-flex align-items-center gap-2">
                                        <span class="ct-badge"
                                              th:if="${member.consumerType != null}"
                                              th:style="'background-color: ' + ${member.consumerType.color}"
                                              th:text="${member.consumerType.note}">
                                        </span>
                                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                                onclick="toggleCtEdit()">수정</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 소비패턴 수정 폼 (기본 숨김) -->
                        <div id="ctEditSection" class="card mt-3" style="display:none;">
                            <div class="card-body">
                                <p class="fw-bold mb-3">소비패턴 변경</p>
                                <form th:action="@{/mypage/consumer-type}" method="post">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                    <div class="d-flex flex-wrap gap-2 mb-3">
                                        <div th:each="type : ${consumerTypes}">
                                            <input type="radio" class="btn-check" autocomplete="off"
                                                   name="consumerType"
                                                   th:id="${'edit_ct_' + type.name()}"
                                                   th:value="${type.name()}"
                                                   th:checked="${member.consumerType == type}">
                                            <label class="ct-btn"
                                                   th:for="${'edit_ct_' + type.name()}"
                                                   th:style="'--ct-color: ' + ${type.color}"
                                                   th:attr="title=${type.description}"
                                                   data-bs-toggle="tooltip"
                                                   data-bs-placement="top"
                                                   th:text="${type.note}">
                                            </label>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary btn-sm">저장</button>
                                        <button type="button" class="btn btn-secondary btn-sm" onclick="toggleCtEdit()">취소</button>
                                    </div>
                                </form>
                            </div>
                        </div>

                        <!-- TODO: 내가 작성한 질문/답변 목록 (질문·답변 기능 구현 후 추가) -->

                        <div class="mt-3 d-flex gap-2">
                            <a th:href="@{/member/delete}" class="btn btn-outline-danger btn-sm">회원탈퇴</a>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit" class="btn btn-outline-secondary btn-sm">로그아웃</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <th:block layout:fragment="script">
            <script>
                function toggleCtEdit() {
                    const sec = document.getElementById('ctEditSection');
                    sec.style.display = sec.style.display === 'none' || sec.style.display === '' ? 'block' : 'none';
                }
                document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
                    new bootstrap.Tooltip(el);
                });
            </script>
        </th:block>
    </body>
</html>
