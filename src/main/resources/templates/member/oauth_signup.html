<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
    <head>
        <title>구글 회원가입</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div class="container mt-5">
                <div class="row justify-content-center">
                    <div class="col-md-6">
                        <h2 class="mb-1">구글 회원가입</h2>
                        <p class="text-muted mb-4">구글 계정으로 처음 로그인하셨습니다. 추가 정보를 입력해 주세요.</p>

                        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                        <form th:action="@{/signup/oauth}" th:object="${oauthForm}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                            <!-- 이메일 (구글에서 가져옴, 수정 불가) -->
                            <div class="mb-3">
                                <label class="form-label">이메일</label>
                                <input type="email" class="form-control bg-light" th:value="${oauthEmail}" disabled>
                                <div class="form-text text-muted">구글 계정 이메일이 자동으로 사용됩니다.</div>
                            </div>

                            <!-- 아이디 -->
                            <div class="mb-3">
                                <label for="username" class="form-label">아이디</label>
                                <input type="text" class="form-control" id="username" th:field="*{username}"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                       placeholder="영문, 숫자 4자 이상">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                            </div>

                            <!-- 닉네임 (구글 이름 기본값, 수정 가능) -->
                            <div class="mb-3">
                                <label for="nickname" class="form-label">닉네임</label>
                                <input type="text" class="form-control" id="nickname" th:field="*{nickname}"
                                       th:classappend="${#fields.hasErrors('nickname')} ? 'is-invalid'">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
                            </div>

                            <!-- 소비패턴 선택 -->
                            <div class="mb-4">
                                <label class="form-label fw-bold">나의 소비패턴 <span class="text-danger">*</span></label>
                                <div th:if="${#fields.hasErrors('consumerType')}" class="text-danger small mb-2" th:errors="*{consumerType}"></div>
                                <div class="d-flex flex-wrap gap-2">
                                    <div th:each="type : ${consumerTypes}">
                                        <input type="radio" class="btn-check" autocomplete="off"
                                               name="consumerType"
                                               th:id="${'ct_' + type.name()}"
                                               th:value="${type.name()}"
                                               th:checked="${oauthForm.consumerType == type}">
                                        <label class="ct-btn"
                                               th:for="${'ct_' + type.name()}"
                                               th:style="'--ct-color: ' + ${type.color}"
                                               th:attr="title=${type.description}"
                                               data-bs-toggle="tooltip"
                                               data-bs-placement="top"
                                               th:text="${type.note}">
                                        </label>
                                    </div>
                                </div>
                                <div class="form-text text-muted mt-1">버튼에 마우스를 올리면 설명이 나타납니다.</div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">회원가입 완료</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <th:block layout:fragment="script">
            <script>
                document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => {
                    new bootstrap.Tooltip(el);
                });
            </script>
        </th:block>
    </body>
</html>
