spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
  application:
    name: BuyOrNot
  config:
    import: optional:file:.env[.properties]
  # DB 연결
  datasource:
    url: jdbc:mysql://localhost:3306/buy_or_not?serverTimezone=Asia/Seoul
    # 환경변수 사용: 시스템에 설정된 값을 불러오고, 없으면 뒤의 기본값(root) 사용
    username: ${DB_USERNAME:root}
    # 보안이 필요한 부분은 기본값을 비워두거나 환경변수만 적음
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: true
  thymeleaf:
    cache: false
